<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/logo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Go Deliver - fast, reliable urban delivery and courier service. Real-time booking, fleet management, and tracking." />
    <meta property="og:title" content="Go Deliver | Urban Delivery & Courier Service" />
    <meta property="og:description" content="Fast, reliable urban delivery and courier service. Real-time booking, fleet management, and tracking." />
    <meta name="theme-color" content="#0F1115" />

    <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

    <!-- Local Static Precompiled CSS (Guaranteed Direct Load) -->
    <link rel="stylesheet" href="/css/app.css" />

    <!-- Standalone Tailwind Engine for Instant Styling Assurance -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                red: '#E53935',
                'red-hover': '#D32F2F',
                black: '#0F1115',
                'black-secondary': '#171A21',
                white: '#FFFFFF',
                'light-bg': '#F8F9FA',
                grey: '#64748B'
              }
            },
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace']
            }
          }
        }
      };
    </script>

    <!-- Internal Critical Fallback CSS (Always executes, zero external dependency) -->
    <style>
      :root {
        --brand-red: #E53935;
        --brand-red-hover: #D32F2F;
        --brand-black: #0F1115;
        --brand-black-secondary: #171A21;
        --brand-white: #FFFFFF;
        --brand-light-bg: #F8F9FA;
        --brand-grey: #64748B;
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        padding: 0;
        background-color: #FFFFFF;
        color: #0F1115;
        font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .btn-primary {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0.625rem 1.25rem;
        background-color: #E53935;
        color: #FFFFFF;
        font-weight: 600;
        font-size: 0.875rem;
        border-radius: 0.5rem;
        border: none;
        cursor: pointer;
        transition: background-color 0.2s ease;
      }
      .btn-primary:hover {
        background-color: #D32F2F;
      }

      .btn-outline {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0.625rem 1.25rem;
        border: 1px solid #E2E8F0;
        background-color: #FFFFFF;
        color: #0F1115;
        font-weight: 600;
        font-size: 0.875rem;
        border-radius: 0.5rem;
        cursor: pointer;
        transition: border-color 0.2s, background-color 0.2s;
      }
      .btn-outline:hover {
        border-color: #CBD5E1;
        background-color: #F8FAFC;
      }

      .focus-visible-ring:focus-visible {
        outline: 2px solid #E53935;
        outline-offset: 2px;
      }
    </style>

    <title>Go Deliver | Urban Delivery & Courier Service</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
